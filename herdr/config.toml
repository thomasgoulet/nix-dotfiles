onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
active_row_bg = "#181825"
sidebar_bg = "#181825"
surface_dim = "#181825"

[terminal]
default_shell = "nu"
kitty_graphics = true

[ui]
pane_borders = "auto"
host_cursor = "native"
sidebar_start_collapsed = true
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"
accent = "white"

[ui.toast]
delivery = "herdr"

[keys]
prefix = "ctrl+space"
help = ["prefix+/", "prefix+?"]
toggle_sidebar = "prefix+space"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
split_vertical = ["prefix+v", "alt+n"]
new_tab = "alt+t"
new_workspace = "alt+w"
close_pane = "alt+c"
close_tab = "alt+q"
rename_tab = "alt+r"
rename_workspace = "alt+shift+r"
zoom = "alt+shift+f"
goto = "alt+s"
copy_mode = "prefix+y"
